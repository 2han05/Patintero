<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patintero Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background:#222;
      margin:0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      position: relative;
      font-family: "Comic Sans MS", "Poppins", sans-serif;
    }
    #game-container { position: relative; display: flex; justify-content: center; align-items: center; }
    canvas { background:#fff; border:3px solid #000; display: block; }

    .icon-button {
      position: absolute;
      top: 15px;
      width: 50px;
      height: 50px;
      background: rgba(0,0,0,0.5);
      border: none;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 0;
      z-index: 5;
    }
    #homeBtn { left: 20px; }
    #restartBtn { right: 20px; }
    .icon-button i { font-size: 24px; color: white; }
    .icon-button:hover { background: rgba(0,0,0,0.7); }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(34,34,34,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
    }
    .overlay h1 { color: #ffeb3b; font-size: 60px; margin-bottom: 20px; text-shadow: 2px 2px 8px #000; }
    .overlay button {
      background: linear-gradient(45deg, #ff5722, #ff9800);
      border: none;
      padding: 20px 60px;
      font-size: 30px;
      border-radius: 50px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255, 152, 0, 0.8);
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    .overlay button:hover {
      background: linear-gradient(45deg, #ff9800, #ff5722);
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(255, 87, 34, 1);
    }
    #gameOverOverlay { display: none; }

    #teamNameInput {
      padding: 10px 20px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      margin-bottom: 20px;
      text-align: center;
    }

    #leaderboardList {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      width: 300px;
      text-align: left;
    }
    #leaderboardList div {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="startOverlay" class="overlay">
      <h1>Patintero</h1>
      <input type="text" id="teamNameInput" placeholder="Enter Team Name" />
      <button id="playBtn">▶ Start</button>
    </div>

    <div id="gameOverOverlay" class="overlay">
      <h1 id="gameOverText">Game Over</h1>
      <div id="leaderboardList"></div>
      <button id="playAgainBtn">▶ Play Again</button>
    </div>

    <button id="homeBtn" class="icon-button"><i class="fas fa-home"></i></button>
    <button id="restartBtn" class="icon-button"><i class="fas fa-rotate-right"></i></button>
    <canvas id="game" width="900" height="700"></canvas>
  </div>

  <script src="one_p_easy.js"></script>

</body>
</html>
