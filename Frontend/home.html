<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patintero - Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #222;
      font-family: 'Fredoka One', cursive, Arial, sans-serif;
      color: white;
    }

    .menu {
      text-align: center;
      padding: 40px 60px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 48px;
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 15px 40px;
      font-size: 22px;
      border: 3px solid white;
      border-radius: 15px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      min-width: 220px;
      text-align: center;
    }

    button:hover {
      background: white;
      color: #ff9800;
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
  <div class="menu">
    <h1>Patintero</h1>
    <button onclick="location.href='modes.html'"><i class="fas fa-play"></i> Play</button>
    <button onclick="location.href='help.html'"><i class="fas fa-question-circle"></i> Help</button>
    <button onclick="location.href='leaderboard.html'"></i> Leaderboard</button>
  </div>
</body>
</html>
